name: Deploy Bookmarked to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

# Cancel superseded workflow runs so deploy jobs do not queue behind stale runs.
# Orphaned in-progress Pages deployments (e.g. after a cancelled workflow) are
# cleared in the deploy job via the GitHub Pages API before deploy-pages runs.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  NEXT_PUBLIC_GIPHY_API_KEY: ${{ secrets.NEXT_PUBLIC_GIPHY_API_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Supabase environment
        run: node scripts/validate-env.mjs

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GIPHY_API_KEY: ${{ secrets.NEXT_PUBLIC_GIPHY_API_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Cancel stuck in-progress Pages deployments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api() {
            curl -fsS \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          owner="${GITHUB_REPOSITORY_OWNER}"
          repo="${GITHUB_REPOSITORY#*/}"
          current_sha="${GITHUB_SHA}"

          in_progress='^(deployment_in_progress|syncing_files|finished_file_sync|updating_pages|purging_cdn)$'

          echo "Checking for stuck GitHub Pages deployments in ${owner}/${repo}..."

          mapfile -t deployment_shas < <(
            api "https://api.github.com/repos/${owner}/${repo}/deployments?environment=github-pages&per_page=30" \
              | jq -r '.[].sha' \
              | sort -u
          )

          if [ "${#deployment_shas[@]}" -eq 0 ]; then
            echo "No prior github-pages deployments found."
            exit 0
          fi

          cancelled_any=false
          for sha in "${deployment_shas[@]}"; do
            if [ "${sha}" = "${current_sha}" ]; then
              continue
            fi

            status_payload="$(api "https://api.github.com/repos/${owner}/${repo}/pages/deployments/${sha}" 2>/dev/null || true)"
            if [ -z "${status_payload}" ]; then
              continue
            fi

            status="$(echo "${status_payload}" | jq -r '.status // empty')"
            if [[ "${status}" =~ ${in_progress} ]]; then
              echo "Cancelling stuck Pages deployment ${sha} (status: ${status})"
              http_code="$(
                curl -s -o /dev/null -w "%{http_code}" -X POST \
                  -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${owner}/${repo}/pages/deployments/${sha}/cancel"
              )"
              echo "Cancel response for ${sha}: HTTP ${http_code}"
              cancelled_any=true
            fi
          done

          if [ "${cancelled_any}" = true ]; then
            echo "Waiting 15s for cancelled deployments to settle..."
            sleep 15
          else
            echo "No stuck in-progress Pages deployments found."
          fi

      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before deploy retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - name: Cancel stuck Pages deployments before retry
        if: steps.deploy.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api() {
            curl -fsS \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          owner="${GITHUB_REPOSITORY_OWNER}"
          repo="${GITHUB_REPOSITORY#*/}"
          current_sha="${GITHUB_SHA}"
          in_progress='^(deployment_in_progress|syncing_files|finished_file_sync|updating_pages|purging_cdn)$'

          mapfile -t deployment_shas < <(
            api "https://api.github.com/repos/${owner}/${repo}/deployments?environment=github-pages&per_page=30" \
              | jq -r '.[].sha' \
              | sort -u
          )

          for sha in "${deployment_shas[@]}"; do
            if [ "${sha}" = "${current_sha}" ]; then
              continue
            fi

            status_payload="$(api "https://api.github.com/repos/${owner}/${repo}/pages/deployments/${sha}" 2>/dev/null || true)"
            [ -z "${status_payload}" ] && continue

            status="$(echo "${status_payload}" | jq -r '.status // empty')"
            if [[ "${status}" =~ ${in_progress} ]]; then
              echo "Cancelling stuck Pages deployment ${sha} (status: ${status}) before retry"
              curl -s -o /dev/null -X POST \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${owner}/${repo}/pages/deployments/${sha}/cancel" || true
            fi
          done

          sleep 15

      - name: Retry deploy to GitHub Pages (1/2)
        id: deploy_retry_1
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before second deploy retry
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry_1.outcome == 'failure'
        run: sleep 45

      - name: Retry deploy to GitHub Pages (2/2)
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v4
